AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Minecraft server host - Ubuntu on t3a.medium (AMD) running PufferPanel in Docker

Parameters:
  AwsRegion:
    Type: String
    Description: AWS region to deploy into. Must match the region the stack is deployed to (--region)
    Default: us-east-1
  MyIpCidr:
    Type: String
    Description: Your public IP in CIDR form. Only this address can reach the server (e.g. 203.0.113.10/32)
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  MinecraftUsersCidr:
    Type: String
    Description: CIDR allowed to connect to the Minecraft game ports (Bedrock 19132, Java 25565). Use 0.0.0.0/0 for anyone (e.g. 203.0.113.0/24)
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: SSM parameter resolving to the Ubuntu amd64 AMI (change the version to use a newer release)
    Default: /aws/service/canonical/ubuntu/server/26.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  KeyName:
    Type: String
    Description: EC2 key pair name (leave empty to use SSM Session Manager only)
    Default: minecraft-keypair

Rules:
  RegionMatchesStackRegion:
    Assertions:
      - Assert: !Equals [!Ref AwsRegion, !Ref 'AWS::Region']
        AssertDescription: AwsRegion must match the region the stack is deployed to

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Resources:
  ServerVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 192.168.160.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: minecraft-pufferpanel-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: minecraft-pufferpanel-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ServerVpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ServerVpc
      CidrBlock: 192.168.160.0/25
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: minecraft-pufferpanel-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ServerVpc
      Tags:
        - Key: Name
          Value: minecraft-pufferpanel-public

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Minecraft + PufferPanel
      VpcId: !Ref ServerVpc
      SecurityGroupIngress:
        - Description: Minecraft Bedrock (UDP)
          IpProtocol: udp
          FromPort: 19132
          ToPort: 19132
          CidrIp: !Ref MinecraftUsersCidr
        - Description: Minecraft Bedrock (TCP)
          IpProtocol: tcp
          FromPort: 19132
          ToPort: 19132
          CidrIp: !Ref MinecraftUsersCidr
        - Description: Minecraft Java (UDP)
          IpProtocol: udp
          FromPort: 25565
          ToPort: 25565
          CidrIp: !Ref MinecraftUsersCidr
        - Description: Minecraft Java (TCP)
          IpProtocol: tcp
          FromPort: 25565
          ToPort: 25565
          CidrIp: !Ref MinecraftUsersCidr
        - Description: PufferPanel SFTP
          IpProtocol: tcp
          FromPort: 5657
          ToPort: 5657
          CidrIp: !Ref MyIpCidr
        - Description: SSH from my IP only
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIpCidr
        - Description: PufferPanel web UI from my IP only
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref MyIpCidr
        - Description: ICMP echo (ping) from my IP only
          IpProtocol: icmp
          FromPort: 8
          ToPort: -1
          CidrIp: !Ref MyIpCidr

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  ServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        InstanceType: t3a.medium
        ImageId: !Ref UbuntuAmiId
        KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - !GetAtt ServerSecurityGroup.GroupId
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              DeleteOnTermination: true
              Encrypted: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: minecraft-pufferpanel-docker
        UserData:
          Fn::Transform:
            Name: AWS::Include
            Parameters:
              Location: user-data.yaml

  ServerInstanceAmd:
    Type: AWS::EC2::Instance
    Properties:
      SubnetId: !Ref PublicSubnet
      LaunchTemplate:
        LaunchTemplateId: !Ref ServerLaunchTemplate
        Version: !GetAtt ServerLaunchTemplate.LatestVersionNumber

  ServerEip:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref ServerInstanceAmd


      ######################################

      

  # 2. IAM Role allowing EventBridge Scheduler to start/stop the instance
  SchedulerExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: EventBridgeStartStopEC2Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ec2:StartInstances'
                  - 'ec2:StopInstances'
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${ServerInstanceAmd}'

  # 3. EventBridge Schedule to STOP the instance at Midnight UTC daily
  StopEC2Schedule:
    Type: 'AWS::Scheduler::Schedule'
    Properties:
      Name: StopEC2
      Description: 'Stops the EC2 instance daily at midnight UTC.'
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: 'cron(0 0 * * ? *)' # Runs at 00:00 UTC every day
      ScheduleExpressionTimezone: 'UTC'
      State: DISABLED
      Target:
        Arn: !Sub 'arn:${AWS::Partition}:scheduler:::aws-sdk:ec2:stopInstances'
        RoleArn: !GetAtt SchedulerExecutionRole.Arn
        Input: !Sub '{"InstanceIds": ["${ServerInstanceAmd}"]}'

  # 4. EventBridge Schedule to START the instance at 8:00 AM UTC daily
  StartEC2Schedule:
    Type: 'AWS::Scheduler::Schedule'
    Properties:
      Name: StartEC2
      Description: 'Starts the EC2 instance daily at 8:00 AM UTC.'
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: 'cron(0 8 * * ? *)' # Runs at 08:00 UTC every day
      ScheduleExpressionTimezone: 'UTC'
      State: DISABLED
      Target:
        Arn: !Sub 'arn:${AWS::Partition}:scheduler:::aws-sdk:ec2:startInstances'
        RoleArn: !GetAtt SchedulerExecutionRole.Arn
        Input: !Sub '{"InstanceIds": ["${ServerInstanceAmd}"]}'

      #####################################

  # 5. AWS Backup: full daily backup (AMI + EBS snapshots) of the instance at midnight Miami time
  BackupVault:
    Type: 'AWS::Backup::BackupVault'
    Properties:
      BackupVaultName: minecraft-pufferpanel-vault

  BackupServiceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores'

  DailyBackupPlan:
    Type: 'AWS::Backup::BackupPlan'
    Properties:
      BackupPlan:
        BackupPlanName: minecraft-pufferpanel-daily
        BackupPlanRule:
          - RuleName: daily-midnight-miami
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: 'cron(0 0 * * ? *)' # Midnight every day
            ScheduleExpressionTimezone: 'America/New_York' # Miami, FL is on Eastern time
            StartWindowMinutes: 60
            CompletionWindowMinutes: 180
            Lifecycle:
              DeleteAfterDays: 3 # Keeps roughly the last 3 daily backups; older ones are deleted

  DailyBackupSelection:
    Type: 'AWS::Backup::BackupSelection'
    Properties:
      BackupPlanId: !Ref DailyBackupPlan
      BackupSelection:
        SelectionName: minecraft-pufferpanel-instance
        IamRoleArn: !GetAtt BackupServiceRole.Arn
        Resources:
          - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${ServerInstanceAmd}'

Outputs:
  PublicIp:
    Value: !Ref ServerEip
  PufferPanelUrl:
    Value: !Sub http://${ServerEip}:8080
  MinecraftAddress:
    Value: !Sub ${ServerEip}:19132
  InstanceId:
    Description: 'The Instance ID of the newly created EC2 instance.'
    Value: !Ref ServerInstanceAmd